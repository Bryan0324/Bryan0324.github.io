# Astro Yun 網站設定
title: 草貓筆記
subtitle: 草貓的部落格農場
description: ''
author: Bryan0324
language: zh-TW
timezone: Asia/Taipei
url: https://bryan0324.github.io
permalink: :year/:month/:day/:title/
future: true

# 每頁文章數；0 表示不分頁
index_generator:
  per_page: 10
per_page: 10
category_map: {}
tag_map: {}

# Yun 主題設定；未指定的值繼承 src/lib/theme-defaults.mjs
theme:
  # light | dark | auto | time | sunset
  # time：07–17 日間、17–20 夕陽、20–07 夜間
  mode: dark
  # 訪客手動切換的模式會優先於此預設值；清除 localStorage 的 darken-mode 可重測。
  mode_toggle:
    enable: true
  colors:
    primary: '#0078E7'
    bg: '#f5f5f5'
    selection_bg: '#8e71c1'
    tag_start_color: '#999999'
    tag_end_color: '#0078E7'
    dark:
      block: '#1b1f2e'
    sunset:
      bg: '#FFF5E6'
      block: '#FFE8D6'
      text: '#8B4513'
      link: '#FF8E53'
      banner: '#FF6B35'
  favicon:
  404:
    message:

  # 側欄、目錄與導覽
  sidebar:
    bg_image: https://cdn.yunyoujun.cn/img/bg/alpha-stars-timing-1.webp
    dark_bg_image: https://cdn.yunyoujun.cn/img/bg/dark-alpha-stars-timing-1.webp
    sunset_bg_image: https://cdn.yunyoujun.cn/img/bg/alpha-stars-timing-1.webp
    bg_position: bottom 1rem center
    tagcloud:
      enable: true
      # 最多顯示幾個標籤；0 表示不顯示標籤。
      amount: 20
  toc:
    list_number: true
    max_depth: 6
    min_depth: 1
    collapse: true
  avatar:
    enable: true
    url: /grass_cat.png
    rounded: true
  social:
    - name: GitHub
      link: https://github.com/Bryan0324
      icon: ri:github-line
      color: '#6e5494'
    - name: Threads
      link: https://www.threads.com/@bryanhuang324
      icon: ri:threads-line
      color: '#545454'
  pages:
    - name: 友誼的力量
      url: /friends/
      icon: ri:user-community-fill
      color: dodgerblue
  anonymous_image: https://cdn.yunyoujun.cn/img/avatar/none.jpg
  menu:
    home:
      path: /
      icon: ri:home-4-line
    list:
      - type: archives
        path: /archives/
        icon: ri:archive-line
      - type: categories
        path: /categories/
        icon: ri:folder-2-line
      - type: tags
        path: /tags/
        icon: ri:price-tag-3-line
    custom:
      title: 網站原始碼連結
      path: https://github.com/Bryan0324/Bryan0324.github.io
      icon: ri:settings-line
  archive:
    last_word: 沒有更多黑歷史ㄌ_(:з」∠)_

  # 文章與分類標籤顏色
  tags:
    Vue: '#4fc08d'
    Hexo: '#0E83CD'
    CSS: '#5298d1'
    Node.js: '#026E00'
    Git: '#F14E32'
    React: '#61dafb'
    Python: '#3776ab'
    PHP: '#8892BF'
    VS Code: '#0066B8'
    JavaScript: '#F4DF4F'
    TypeScript: '#317AC6'
    Laravel: '#F4645F'
  categories:
    部落格: dimgray
  post_card:
    opacity: 0.9
  post_meta:
    item_text: false
    created_at: true
    updated_at: true
    categories: true
    tags: true
  codeblock:
    prismjs:
      line_number: true
  creative_commons:
    license: by-nc-sa
    language: deed.zh
    post: true
  icons:
    category: ri:folder-2-line
    tag: ri:price-tag-3-line

  # 橫幅、字體與背景特效
  banner:
    enable: true
    title: 草貓的貓草園
    border: true
    cloud:
      enable: true
      color: white
    go_down:
      enable: true
      icon: ri:arrow-down-s-line
  font:
    cdn:
      enable: true
      lib:
        - https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&display=swap
    serif:
      family: "'Songti SC', 'Noto Serif SC', STZhongsong, STKaiti, KaiTi, Roboto, serif"
      weight: 900
    sans_serif:
      family: "'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif"
      weight: 400
    monospace:
      family: "'Source Code Pro', Consolas, Monaco, SFMono-Regular, 'Ubuntu Mono', Menlo, monospace"
  fireworks:
    enable: true
    colors:
      - '102, 167, 221'
      - '62, 131, 225'
      - '33, 78, 194'
      - '3, 28, 95'
      - '0, 8, 55'
  cursor:
    enable: false
    default: https://cdn.yunyoujun.cn/css/md-cursors/pointer.cur
    pointer: https://cdn.yunyoujun.cn/css/md-cursors/link.cur
    text: https://cdn.yunyoujun.cn/css/md-cursors/text.cur
  smoothScroll: true
  scrollreveal:
    enable: true
  bg_image:
    enable: true
    url: https://cdn.yunyoujun.cn/img/bg/stars-timing-0-blur-30px.jpg
    dark: https://cdn.yunyoujun.cn/img/bg/galaxy.jpg
    sunset: https://img.freepik.com/free-photo/sea-landscape-with-digital-art-style_23-2151158336.jpg
    opacity: 1

  # 頁尾
  footer:
    since: 2025
    icon:
      name: ri:cloud-line
      animated: true
      color: '#0078E7'
    powered:
      enable: true
    live_time:
      enable: true
      prefix: 喵喵喵~ 已經運行了喵~
      suffix: (●'◡'●)
      start_time: '2025-12-25T00:00:00'

  # 搜尋、圖表與留言
  search:
    # true：毛玻璃背景；false：使用下方背景圖。搜尋仍以對話框開啟。
    modal: true
    bg_image: https://cdn.yunyoujun.cn/img/bg/stars-timing-0-blur-30px.jpg
    dark_bg_image: https://cdn.yunyoujun.cn/img/bg/mountain-blur-30px.jpg
    placeholder: 想搜什喵？
  local_search:
    enable: true
  mermaid:
    enable: true
  comment:
    enable: true
  giscus:
    enable: true
    repo: Bryan0324/Bryan0324.github.io
    repo-id: R_kgDOQuqauw
    category: Announcements
    category-id: DIC_kwDOQuqau84C0kJ8
    mapping: pathname
    reactions-enabled: 1
    emit-metadata: 1
    # auto 隨網站日夜模式切換；也可指定 light、dark、transparent_dark 或自訂 CSS URL。
    theme: auto
    lang: zh-TW
    loading: lazy # lazy：接近留言區時載入；eager：進入頁面立即載入
    input-position: top
    strict: 0
